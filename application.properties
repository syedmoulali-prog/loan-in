# ====================================================
# CUSTOMER LOAN ELIGIBILITY SYSTEM - APPLICATION CONFIG
# ====================================================

spring.application.name=loan-eligibility-backend
server.port=8080

# Primary Data Source (Defaults to persistent H2 in MySQL Compatibility Mode for zero-friction local execution)
# To connect to MySQL server, run with: -Dspring-boot.run.profiles=mysql or set DB_URL
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/customer_loan_system;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Security & JWT Settings
jwt.secret=${JWT_SECRET:CustomerLoanEligibilitySystemSecretKeyForJwtTokenSigning2026SecureKey!}
jwt.expirationMs=86400000

# File Upload Settings for Documents
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# Logging
logging.level.com.loaneligibility=INFO
logging.level.org.springframework.security=WARN
