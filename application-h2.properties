# Profile for standalone testing or development without local MySQL server
spring.datasource.url=jdbc:h2:mem:customer_loan_system;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:CustomerLoanEligibilitySystemSecretKeyForJwtTokenSigning2026SecureKey!}
jwt.expirationMs=86400000
file.upload-dir=./uploads
